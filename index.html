<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CURLEW York Action Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* layout: calm working page. Headline states the message; day strip; group picker; one white panel per section; teal accent, red only for the deadline and overdue items */
  --bg:#f3f5f4; --surface:#ffffff; --hover:#eaf1f0; --ink:#14212b; --sec:#52626d; --mut:#7d8a93; --rule:#d6dddd; --red:#c2372b; --accent:#0f6f78; --bar:#7b8a92; --on:#ffffff;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:var(--body);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#10181d; --surface:#18232a; --hover:#22313a; --ink:#e8eef0; --sec:#a9b8c1; --mut:#8496a1; --rule:#2c3a43; --red:#f07a6c; --accent:#4fb8c0; --bar:#6f828d; --on:#10181d; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#10181d; --surface:#18232a; --hover:#22313a; --ink:#e8eef0; --sec:#a9b8c1; --mut:#8496a1; --rule:#2c3a43; --red:#f07a6c; --accent:#4fb8c0; --bar:#6f828d; --on:#10181d; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:38px;line-height:1.08;font-weight:800;letter-spacing:-.02em}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--ink)}
.mono{font:500 11.5px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--sec)}
.red{color:var(--red)}
.dek{font-size:18px;color:var(--sec);max-width:62ch;margin-top:8px}
.byline{margin-top:10px}
.block{border-top:3px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.lede{color:var(--sec);max-width:68ch}
button,.btn{font:500 11.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink);background:var(--bg);border:1px solid var(--ink);border-radius:2px;min-height:32px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
button:hover,.btn:hover{background:#f1f1f1}
button.on,.btn.on{background:var(--ink);color:#fff}
button.link{border:0;min-height:24px;padding:0 2px;text-decoration:underline;background:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tabs,.picker{display:flex;flex-wrap:wrap;gap:6px}
input[type=search],input[type=text]{font:400 15px var(--body);color:var(--ink);border:1px solid var(--ink);border-radius:2px;min-height:36px;padding:4px 10px;background:#fff;width:100%}
.hidden{display:none !important}
/* meeting */
.meet{border-left:3px solid var(--ink);padding-left:12px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
.meet .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* strip */
.days{display:grid;gap:0}
.days .c{text-align:center;font:500 10px/1.3 var(--mono);color:var(--sec);padding:3px 0;border-left:1px solid var(--rule)}
.days .c.we{color:var(--mut)}
.days .c.today{background:var(--ink);color:#fff}
.days .c.dl{color:var(--red);font-weight:600}
.ms{display:flex;flex-direction:column;gap:2px;padding-top:8px;border-top:1px solid var(--rule)}
.ms .t{font-size:14px}
.ms .t b{font-weight:600}
.mtrack{display:grid;height:14px}
.mtrack i{background:var(--bar);height:8px;align-self:center;border-radius:1px}
.mtrack i.pt{background:var(--ink);width:10px;height:10px;transform:rotate(45deg);justify-self:center}
.mtrack i.dlm{background:var(--red)}
/* progress */
.prow{display:grid;grid-template-columns:230px 1fr 90px;gap:12px;align-items:center;padding:5px 0;border-top:1px solid var(--rule);text-decoration:none}
.prow .pb{height:6px;background:var(--rule)}
.prow .pb i{display:block;height:100%;background:var(--ink)}
.prow .n{font:500 12px var(--mono);text-align:right;color:var(--ink)}
.prow .d{display:block;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--sec)}
@media (max-width:640px){.prow{grid-template-columns:1fr 80px}.prow .pb{grid-column:1 / -1;order:3}}
/* tools */
.tools{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
@media (max-width:640px){.tools{grid-template-columns:1fr}}
.switch{display:inline-flex;gap:8px;align-items:center;min-height:32px;cursor:pointer}
.switch input{width:22px;height:22px;margin:0;accent-color:var(--ink)}
.notice{border:1px solid var(--ink);padding:8px 10px;border-radius:2px;max-width:80ch}
/* cards */
.card{border-top:3px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.chead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.kind{margin-top:10px;padding-top:6px;border-top:1px solid var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sub{margin-top:10px}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{border-top:1px solid var(--rule);padding:7px 0;display:flex;flex-direction:column;gap:3px}
.row{display:grid;grid-template-columns:30px 1fr;align-items:start;cursor:pointer;min-height:28px}
.row input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ink)}
.tx b{font-weight:600}
li.done .tx{color:var(--mut);text-decoration:line-through}
.meta{padding-left:30px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
li.dec .meta,li.dec .tx{padding-left:0}
.lab{font:600 11px var(--mono);letter-spacing:.08em;border:1px solid var(--ink);padding:1px 5px;border-radius:2px;text-transform:uppercase}
.ans{font-weight:500}
form.af{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:end;max-width:720px}
form.af label{grid-column:1 / -1}
@media (max-width:520px){form.af{grid-template-columns:1fr 1fr}form.af input{grid-column:1 / -1}}
details.notes{border-top:1px solid var(--ink);margin-top:10px;padding-top:6px}
details.notes summary{cursor:pointer;min-height:28px;display:flex;align-items:center}
details.notes li{font-size:13px;color:var(--sec)}
/* long-run chart */
.tl{display:flex;flex-direction:column}
.tlr{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:center;border-top:1px solid var(--rule);min-height:32px}
.tlr .l{font-size:13px;font-weight:600;line-height:1.25;padding:4px 0}
.tlr .l small{display:none;font:400 11.5px var(--mono);color:var(--sec)}
.trk{position:relative;height:30px;background:repeating-linear-gradient(90deg,var(--rule) 0,var(--rule) 1px,transparent 1px,transparent 5%)}
.axis{display:grid;grid-template-columns:repeat(20,1fr);font:500 10.5px var(--mono);color:var(--sec);text-align:center}
.yrs{position:relative;height:15px;font:600 10.5px var(--mono);color:var(--ink)}
.yrs span{position:absolute}
.gb{position:absolute;top:8px;height:14px;background:var(--bar)}
.gp{position:absolute;top:10px;width:10px;height:10px;background:var(--ink);transform:translateX(-5px) rotate(45deg)}
.gp.dlm{background:var(--red)}
.gp.edge{transform:translateX(2px) rotate(45deg)}
.gn{position:absolute;top:6px;white-space:nowrap;font:400 11.5px/18px var(--mono);color:var(--ink);background:var(--bg);padding:0 4px}
.gn.in{background:transparent;color:#fff}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
@media (max-width:700px){
  .tlr{grid-template-columns:1fr;gap:0;padding:4px 0}
  .tlr .l small{display:block}
  .gn{display:none}
  .trk{height:22px}.gb{top:4px}.gp{top:6px}
  h1{font-size:32px}
}
/* said */
.said h3{margin-top:6px}
.said ul{margin:4px 0 0;padding-left:18px}
.said li{margin:2px 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 28px}
table.key{border-collapse:collapse;font-size:14px;width:100%;max-width:760px}
table.key td{padding:4px 12px 4px 0;vertical-align:top;border-top:1px solid var(--rule)}
footer{border-top:3px solid var(--ink);padding-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* calm look */
h1{font-size:32px;font-weight:700;letter-spacing:-.005em;line-height:1.15}
h2{font-size:20px;font-weight:700;letter-spacing:0}
a{color:var(--accent)}
.mono{font:500 12.5px/1.4 var(--body);text-transform:none;letter-spacing:0;color:var(--sec)}
.block,.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px}
button,.btn{font:500 13px/1 var(--body);text-transform:none;letter-spacing:0;border-color:var(--rule);border-radius:999px;background:var(--surface);padding:0 13px}
button:hover,.btn:hover{background:var(--hover)}
button.on,.btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button.link{border-radius:4px;color:var(--accent);background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search],input[type=text]{border-color:var(--rule);border-radius:8px;background:var(--surface)}
.meet{border-left:4px solid var(--accent);background:var(--hover);padding:10px 14px;border-radius:0 8px 8px 0;max-width:none}
.days .c{font:500 11px/1.3 var(--body);border-left:0}
.days .c.today{background:var(--ink);color:var(--bg);border-radius:4px}
.mtrack i{border-radius:4px;background:var(--accent)}
.mtrack i.pt{background:var(--accent);border-radius:2px}
.mtrack i.dlm{background:var(--red)}
.prow .pb{height:8px;border-radius:999px;overflow:hidden}
.prow .pb i{background:var(--accent)}
.prow .n{font:500 13px var(--body)}
.prow .d{font:400 12px var(--body);text-transform:none;letter-spacing:0}
.switch input,.row input{accent-color:var(--accent)}
.notice{border-color:var(--rule);border-radius:8px;background:var(--hover)}
.kind,details.notes{border-top:1px solid var(--rule)}
.lab{font:600 11.5px var(--body);letter-spacing:.02em;text-transform:none;border-color:var(--accent);color:var(--accent);border-radius:4px}
.axis,.yrs{font-family:var(--body)}
.gb{border-radius:3px}
.gn{font:400 12px/18px var(--body);background:var(--surface)}
.gn.in{color:var(--on)}
.gp{border-radius:2px}
footer{border-top:1px solid var(--rule);font-size:13px}
.top2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media (max-width:760px){.top2{grid-template-columns:1fr}}
.count{display:flex;gap:18px;flex-wrap:wrap}
.count div{display:flex;flex-direction:column}
.count b{font:700 36px/1 var(--display);color:var(--red)}
.count span{font-size:12px;color:var(--sec);text-transform:uppercase;letter-spacing:.08em}
.big{font:700 36px/1 var(--display)}
.obar{height:12px;background:var(--rule);border-radius:999px;overflow:hidden}
.obar i{display:block;height:100%;background:var(--accent);border-radius:999px}
</style>
</head>

<script>
/* Shared ticks for the GitHub Pages copy: talks to the Google Sheet web app instead of Claude's database. */
(function(){
  var API = "https://script.google.com/macros/s/AKfycbw6rr5GR6CWEyBISDeIY0QqpqGhFfwLh8r9zYspwqczDFNQJamgIXyVR7Oo5FpF1UMz/exec"; /* <- the web app URL from the Google Sheet script */
  var live = /^https:\/\/script\.google\.com\//.test(API) || /^http:\/\/127\.0\.0\.1/.test(API);
  window.CURLEW_BASE = location.href.split("#")[0];
  window.CURLEW_RO_NOTE = "Read-only: the shared ticks are not connected yet. Please tell Christa Schneider.";
  var state = null, subs = [], timer = null;
  function fire(){ subs.forEach(function(f){ try{ f(); }catch(e){} }); }
  function take(r){ if(r && r.ok){ state = r; fire(); return r; } throw {code:"unavailable", message:(r&&r.error)||"no answer"}; }
  function load(){ if(!live) return Promise.resolve(); return fetch(API,{redirect:"follow"}).then(function(r){return r.json();}).then(take).catch(function(){}); }
  function post(o){ if(!live) return Promise.reject({code:"invalid_argument"});
    if(window.curlewLabel && o.id) o.label = window.curlewLabel(o.id);
    return fetch(API,{method:"POST",redirect:"follow",body:JSON.stringify(o)}).then(function(r){return r.json();}).then(take); }
  function snap(id,body){ return {id:id, exists:!!body, data:function(){return body||undefined;}, metadata:{fromCache:false}}; }
  function listen(make){ var dead=false, f=function(){ if(!dead && state) make(); }; subs.push(f); if(state) setTimeout(f,0); return function(){ dead=true; }; }
  function coll(name){ var o={
    orderBy:function(){return o;}, limit:function(){return o;},
    add:function(){ return Promise.resolve(); }, /* the sheet records every change itself */
    onSnapshot:function(next){ return listen(function(){
      var docs = name==="marks" ? Object.keys(state.marks).map(function(k){return snap(k,state.marks[k]);})
               : name==="log" ? state.log.map(function(e,i){return snap("r"+i,e);}) : [];
      next({docs:docs, metadata:{fromCache:false}}); }); } };
    return o; }
  var db = { collection: coll, doc: function(path){ var p=path.split("/"), id=p[1]; return {
    set:function(b){ if(p[0]==="marks") return post({act:b.s, id:id, name:b.name, answer:b.answer||""});
      if(path==="settings/meeting") return post({act:"meeting-set", id:"meeting", name:b.name, date:b.date}); return Promise.resolve(); },
    "delete":function(){ var nm=""; try{ nm=JSON.parse(localStorage.getItem("curlew-york-ui-v2")||"{}").name||""; }catch(e){}
      if(p[0]==="marks") return post({act:"undone", id:id, name:nm});
      if(path==="settings/meeting") return post({act:"meeting-cleared", id:"meeting", name:nm}); return Promise.resolve(); },
    onSnapshot:function(next){ return listen(function(){
      if(path==="settings/meeting") next(snap("meeting",state.meeting));
      else if(path==="settings/log") next(snap("log",{start:state.start||"1970-01-01T00:00:00.000Z"}));
      else next(snap(id,null)); }); } }; } };
  var user = { id:function(){return Promise.resolve(null);}, can:function(){return Promise.resolve(live);}, isOwner:function(){return Promise.resolve(false);},
    me:function(){return Promise.resolve({name:""});}, profiles:function(ids){var r={};[].concat(ids).forEach(function(i){r[i]={name:""};});return Promise.resolve(r);} };
  window.claude = { use:function(n){ return Promise.resolve(n==="db" ? (live?db:null) : n==="user" ? user : null); } };
  load();
  timer = setInterval(function(){ if(!document.hidden) load(); }, 30000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) load(); });
})();
</script>

{key:"cons", name:"Consonants and suprasegmentals", sort:"2026-11-30b", own:"consonants group", due:"30 Nov 2026", d:DL,
 lead:"to be confirmed", meta:"Agreed next step: define some spare items and check the prompts carefully.",
 sections:[

  {h:"Prompt changes", items:[
    "T|Singing :: nice to get 's____' for 'singer' too, but too difficult? Simplify the repetition in the prompt, especially with the different positions; 'Man is singing the song'?",
    "T|Watering plants :: new image; also change 'lady'",
    "T|Books :: the /s/ might affect the fricative for Scouse, so use singular 'book'; 'pile' rather than 'stack' is then not needed",
    "T|Grasshopper / cricket :: do people distinguish them? BATH + /h/ + lettER need not sit in one prompt; make it simpler",
    "D|Printer :: do people know what it is (too complex or office-specific)? Morphosyntactic confound with in/into; ordering; '-ing paper' gives place assimilation to bilabial, which Ryan says is useful",
    "D|Father :: difficult as a target word for formality reasons",
    "T|Village and city :: not 'image', maybe 'picture'; 'A small village and a big city'",
    "T|Car engine :: replace with four apples in different colours; might just get 'apples'?",
    "D|Ella asks :: ordering note; confounds double modals for morphosyntax; 'vanilla ice cream' instead?",
    "D|Pounds / quid :: is the ordering note necessary? Also combines with the calendar numbers",
    "T|It'll melt quickly :: contraction 'it'll melt'; blank 'qu____' for quick/quickly",
    "D|The man's checking :: just 'mobile'? But then you would get 'messages'",
    "D|Clock :: combine with half past / half eleven? Might be hard for people used to digital clocks",
    "T|Google :: replace with another -gle word; jungle (problem with the velar)? giggle?",
    "D|Belt buckle :: should be covered by 'circle' in the vowels shape question",
    "T|Football :: coordinate with the vowels group",
    "T|Steep hill :: 10% is not a steep hill",
    "T|Fall off :: careful about the length of the gaps; people may say 'fall from'; David says it is OK to force off / off of",
    "T|Berries :: looks similar to the apples question; might get 'four types of berries'; 'These are types of …' instead of 'What are these?'",
    "T|You're going to hurt your :: change 'going to' to 'gonna'",
    "T|High street :: remove 's____' and capitalise: 'High ______'",
    "D|Bottle :: bottle / bottle of water",
    "T|Ticket :: add a train ticket or another type of ticket",
    "D|Fence :: looks too severe, maybe a picket fence; preposition stranding and ordering; 'put up' is difficult for many reasons; 'brand new fence' to avoid backtracking; or 'put up a shelf'; or another phrase (set up/off, lot of, got on/off). Morphosyntax asks whether participants can be asked 'put a new x up'.",
    "T|Better soon :: make the line longer",
    "D|Battery :: Duracell colours might elicit 'Duracell'; could also be corrected on the spot",
    "T|Happy New Year :: capitalise; make the fireworks show say '2027' etc.",

    "D|Golf / health :: epenthesis, with glottal? Other examples: vimto, hamster, prince, mince"

  {h:"To decide: variables", items:[
    "D|Missing /ʒ/ :: relevant? 'garage' and 'beige' are in the lexis group",

    "D|'th' in different positions :: medial more likely than initial (brother more likely than there); 'think' lexically specific (tink)",
    "D|Glottal reinforcement of /k/ :: cackle; thirty etc.?",
    "D|Stress shifts in verb/noun pairs :: record, research, increase",
    "D|Blanks :: related to word length, but different for morphosyntax"
  ]},
  {h:"To decide: prosody and suprasegmentals", items:[
    "D|Statement pairs that can be reformulated into questions; plus discourse-pragmatic prompts; plus spontaneous prompts",

    "D|Ask for a long 'ahhhh'? Also filled pauses",

{key:"morph", name:"Morphosyntax", sort:"2026-11-22a", own:"morphosyntax group", due:"30 Nov 2026", d:DL,
 lead:"Oddur Snorrason with David Willis", meta:"Trickier than phonetics because of app logistics and later data processing. Prompts and variables are to be defined and decided by about 20 November. Block led by Oddur Snorrason; notes: Alina Waitzmann.",

    "T|15 :: confusion because of the 'sorry'; needs a concrete noun at the end",
    "D|16 :: 'I don't have a clue': too formal, maybe idiomatic; a different concept? 'Sorry, I _____ have time'?",
    "T|17 :: 'I did not but you should ___' (because of stress)",

    "D|37 :: problem: 'remains'",
    "D|38 :: 'every month' can be emotive; 'see your folks', 'all the time'; to/for? 'comes over'? Secondary: habitual do",

  var title=k==="T"?"Tasks":"Decisions", word=k==="T"?"done":"decided";
  var h='<div class="kind"><h3>'+title+'</h3><span class="mono">'+done+' of '+all.length+' '+word+'</span></div>';
  var lastH=null; h+='<ul class="items">';
  show.forEach(function(x){ if(x.h!==lastH){ h+='</ul><p class="mono sub">'+esc(x.h)+'</p><ul class="items">'; lastH=x.h; } h+=itemHtml(x); });
  h+='</ul>';
  if(!show.length) h+='<p class="lede">Nothing open here.</p>';
  if(ui.openOnly&&!searching&&done) h+='<p><button type="button" class="link" id="rv-'+gkey+k+'" data-reveal="'+gkey+k+'">'+done+' '+word+', '+(reveal[gkey+k]?'hide them':'show them')+'</button></p>';
  return h;
}
function cardHtml(g,items,searching){
  if(g.plain) return searching?"":'<section class="card" id="g-'+g.key+'"><h2>'+esc(g.name)+'</h2><p>'+esc(g.plain)+'</p></section>';
  if(searching&&!items.length) return "";
  var c=counts(g);
  var h='<section class="card" id="g-'+g.key+'"><div class="chead"><div><h2>'+esc(g.name)+'</h2>'
   +(g.lead?'<p style="margin-top:2px"><span class="mono">Lead</span> <b>'+esc(g.lead)+'</b></p>':'')+'</div>'
   +'<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="mono">'+c.done+' of '+c.act+' done or decided</span><button type="button" id="cp-'+g.key+'" data-copy="'+g.key+'">Copy link to this list</button></div></div>'
   +'<p class="lede">'+esc(g.meta)+'</p><p class="mono">'+c.T+' tasks · '+c.D+' decisions · '+c.N+' notes'+(searching?' · showing '+items.length+' matching':'')+'</p>';
  h+=listByKind(items,"T",g.key,searching)+listByKind(items,"D",g.key,searching);
  var notes=items.filter(function(x){return x.k==="N";});
  if(notes.length) h+='<details class="notes"'+(searching?' open':'')+'><summary class="mono">Notes ('+notes.length+')</summary><ul class="items">'+notes.map(itemHtml).join("")+'</ul></details>';
  return h+'</section>';
}
function cardsHtml(){
  var h="";
  if(flash) h+='<p class="notice" role="status">'+esc(flash)+'</p>';
  if(q){
    var hit=search(q), by={}; hit.forEach(function(x){(by[x.g]=by[x.g]||[]).push(x);});
    h+='<p class="mono" role="status">'+hit.length+' items match "'+esc(q)+'" across all groups</p>';
    GROUPS.forEach(function(g){ if(by[g.key]) h+=cardHtml(g,by[g.key],true); });
    if(!hit.length) h+='<p class="lede">No item matches. Try a shorter word.</p>';
  } else h+=cardHtml(BYG[ui.group],BYG[ui.group].items,false);
  return h;
}
function noteHtml(){
  if(!loaded) return '<p class="notice" role="status">'+esc(loadNote)+'</p>';
  if(!writable()) return '<p class="notice" role="status">'+esc(window.CURLEW_RO_NOTE||"Read-only: you can see what is ticked and decided, but not change it. Ask Christa Schneider for contributor access to this page.")+'</p>';
  return "";
}
function timelineHtml(){
  var now=new Date(), m=(now.getFullYear()-2026)*12+(now.getMonth()-11)+(now.getDate()-1)/31;
  var pc=function(x){return (x/20*100).toFixed(2)+"%";};
  var h='<div class="tl"><div class="tlr" style="border-top:0;min-height:0"><div></div><div><div class="yrs"><span style="left:0">\u201926</span><span style="left:'+pc(1)+'">2027</span><span style="left:'+pc(13)+'">2028</span></div><div class="axis">'+MONTHS.map(function(x){return "<span>"+x+"</span>";}).join("")+'</div></div></div>';
  TL.forEach(function(r){
    h+='<div class="tlr"><div class="l">'+esc(r.l)+'<small>'+esc(r.n)+'</small></div><div class="trk">';
    if(m>=0&&m<=20) h+='<span class="now" style="left:'+pc(m)+'"></span>';
    if(r.p!=null) h+='<span class="gp'+(r.dl?' dlm':'')+(r.p===0?' edge':'')+'" style="left:'+pc(r.p)+'"></span><span class="gn'+(r.dl?' red':'')+'" style="left:calc('+pc(r.p)+' + 10px)">'+esc(r.n)+'</span>';
    else if(r.s!=null){ h+='<span class="gb" style="left:'+pc(r.s)+';width:'+pc(r.e-r.s)+'"></span>';
      if(r.e-r.s>8) h+='<span class="gn in" style="left:calc('+pc(r.s)+' + 4px)">'+esc(r.n)+'</span>';
      else if(r.e>12) h+='<span class="gn" style="right:calc('+pc(20-r.s)+' + 4px)">'+esc(r.n)+'</span>';
      else h+='<span class="gn" style="left:calc('+pc(r.e)+' + 4px)">'+esc(r.n)+'</span>'; }
    else h+='<span class="gn" style="left:4px">'+esc(r.n)+'</span>';
    h+='</div></div>';
  });
  return h+'</div><p class="mono">Grey bars: periods · black diamonds: milestones · red: the 30 November deadline'+(m<0?' · today is before the start of this chart':' · black line: today')+'</p>';
}
function saidHtml(){
  var h='<section class="block"><h2>Names and initials</h2><table class="key">'+PEOPLE.map(function(p){return "<tr><td><b>"+esc(p[0])+"</b></td><td>"+esc(p[1])+"</td><td>"+esc(p[2])+"</td></tr>";}).join("")+'</table><p class="mono">Also mentioned: Gary Thoms, Devyani Sharma, Yves Scherrer, Simon Roper</p></section>';
  SAID.forEach(function(n){
    h+='<section class="block said"><h2>'+esc(n.name)+'</h2><p class="mono">'+esc(n.when)+'</p><div class="cols">';
    var blocks=n.blocks.slice(), g=n.plan&&BYG[n.plan];
    if(g){ if(n.plan!=="all") blocks.unshift({h:"Context",items:[g.meta]}); g.sections.forEach(function(s){blocks.push({h:s.h,items:s.items.map(function(it){return typeof it==="string"?it.slice(2):it.t;})});}); }
    blocks.forEach(function(b){h+='<div>'+(b.h?'<h3>'+esc(b.h)+'</h3>':'')+'<ul>'+b.items.map(function(i){return "<li>"+fmt(i)+"</li>";}).join("")+'</ul></div>';});
    h+='</div></section>';
  });
  return h;
}

/* ---------- shell ---------- */
function view(){var h=(location.hash||"").replace("#","");return h==="said"?"said":"do";}
function shell(){
  $("app").innerHTML='<header id="head"></header>'
   +'<nav class="tabs" aria-label="Views"><a class="btn" id="tab-do" href="#do">What to do</a><a class="btn" id="tab-said" href="#said">What was said</a></nav>'
   +'<main id="v-do" style="display:flex;flex-direction:column;gap:28px">'
   +'<div class="top2"><section class="block"><p class="mono">Hard deadline for all variables · Monday, 30 November 2026, 23:59 Bern time</p><div class="count" id="count" role="timer"></div></section><section class="block"><p class="mono">Completion, items due by the end of November</p><div id="overall" style="display:flex;flex-direction:column;gap:8px"></div></section></div>'
   +'<section class="block"><h2>Next three weeks</h2><div class="meet" id="meet"></div><div id="strip" style="display:flex;flex-direction:column;gap:8px"></div></section>'
   +'<section class="block"><h2>Pick your group</h2><p class="lede">Each button opens that group’s list. Your choice is remembered on this device, and every list has its own link to send round.</p><nav class="picker" id="picker" aria-label="Groups"></nav></section>'
   +'<section class="block"><h2>Progress by group</h2><p class="lede">Tasks done and decisions decided, sorted by due date. Notes are not counted; Localities is not tracked here.</p><div id="progress"></div></section>'
   +'<section class="block"><h2>Lists</h2><div style="max-width:420px"><label class="mono" for="myname">Your name (shown next to your changes; remembered on this device)</label><input type="text" id="myname" maxlength="60" autocomplete="name" placeholder="First name and surname"></div><div class="tools"><div><label class="mono" for="q">Search all items in all groups</label><input type="search" id="q" placeholder="e.g. football" autocomplete="off"></div>'
   +'<label class="switch" for="openonly"><input type="checkbox" id="openonly" role="switch"'+(ui.openOnly?' checked':'')+'><span class="mono">Show open items only</span></label></div><div id="note"></div></section>'
   +'<div id="cards" style="display:flex;flex-direction:column;gap:28px"></div>'
   +'<section class="block"><h2>Change log</h2><p class="lede">Who changed what and when, newest first. Entries are kept even when a tick is undone or a decision is reopened.</p><div id="log"></div></section>'
   +'<section class="block"><h2>The long run, December 2026 to July 2028</h2><div id="timeline"></div></section>'
   +'</main><main id="v-said" class="hidden" style="display:flex;flex-direction:column;gap:28px"><p class="lede">The complete record of the meeting notes of 5 and 6 November, sorted by topic. What has to be done is under "What to do".</p><div id="said" style="display:flex;flex-direction:column;gap:28px"></div></main>'
   +'<footer class="mono"><span>CURLEW</span><span>Source: team notes, York, 5 and 6 November 2026 · Questions: Christa Schneider</span></footer>';
  $("timeline").innerHTML=timelineHtml();
  $("said").innerHTML=saidHtml();
}
function keepFocus(fn){
  var a=document.activeElement, id=a&&a.id, pos=(a&&a.tagName==="INPUT"&&a.type==="text")?a.selectionStart:null;
  fn();
  if(editing){var inp=$("ans-"+editing); if(inp){inp.value=draft;}}
  if(id){var el=$(id); if(el&&el!==document.activeElement){try{el.focus({preventScroll:true}); if(pos!=null) el.setSelectionRange(pos,pos);}catch(e){}}}
  names();
}
function renderDyn(){
  keepFocus(function(){
    var v=view();
    $("v-do").classList.toggle("hidden",v!=="do"); $("v-said").classList.toggle("hidden",v!=="said");
    $("tab-do").classList.toggle("on",v==="do"); $("tab-said").classList.toggle("on",v==="said");
    $("head").innerHTML=headHtml(); $("meet").innerHTML=meetHtml(); $("strip").innerHTML=stripHtml();
    $("overall").innerHTML=overallHtml(); $("picker").innerHTML=pickerHtml(); $("progress").innerHTML=progressHtml(); $("note").innerHTML=noteHtml(); $("cards").innerHTML=cardsHtml(); $("log").innerHTML=logHtml();
  });
}
function names(){
  if(!user||!user.profiles) return;
  var els=document.querySelectorAll("[data-uid]"), ids=[]; els.forEach(function(e){var i=e.getAttribute("data-uid"); if(i&&ids.indexOf(i)<0) ids.push(i);});
  if(!ids.length) return;
  user.profiles(ids).then(function(ps){els.forEach(function(e){var p=ps[e.getAttribute("data-uid")]; e.textContent=(p&&p.name)||"someone";});});
}
function fail(err,id){
  var code=err&&err.code;
  if(code==="invalid_argument"||code==="not_granted"||code==="revoked"){canWrite=false; flash="";}
  else flash="That could not be saved. Please try again in a moment.";
  if(id) delete busy[id]; renderDyn();
}
function write(id,body){
  if(!writable()||busy[id]) return; busy[id]=1; flash="";
  var ref=db.doc("marks/"+id), p=body?ref.set(body):ref["delete"](), old=marks[id], x=BYID[id];
  if(body) marks[id]=body; else delete marks[id];
  renderDyn();
  p.then(function(){delete busy[id];
    var e={id:id, act: body?body.s:((x&&x.k==="D")?"reopened":"undone")}; if(body&&body.answer) e.answer=body.answer; if(!body&&old&&old.answer) e.prev=old.answer; logAdd(e);
  },function(e){fail(e,id);});
}
function stamp(o){o.by=uid||""; o.name=(ui.name||"").trim().slice(0,60); o.at=new Date().toISOString(); return o;}
function needName(){ if((ui.name||"").trim()) return false; flash="Please enter your name first, in the field \"Your name\" above the lists. It is shown next to your changes."; renderDyn(); var n=$("myname"); if(n){ n.focus(); if(n.scrollIntoView) n.scrollIntoView({block:"center"}); } return true; }

document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="openonly"){ui.openOnly=t.checked; reveal={}; saveUi(); renderDyn(); return;}
  var id=t.getAttribute&&t.getAttribute("data-tick"); if(!id) return;
  if(needName()) return;
  write(id, t.checked?stamp({s:"done"}):null);
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){q=t.value.trim(); renderDyn(); return;}
  if(t.id==="mt-date"){meetDraft=t.value; return;}
  if(t.id==="myname"){ui.name=t.value.slice(0,60); saveUi(); if(flash&&ui.name.trim()){flash=""; renderDyn();} return;}
  if(t.id&&t.id.indexOf("ans-")===0) draft=t.value;
});
document.addEventListener("submit",function(e){
  var f=e.target, id=f.getAttribute&&f.getAttribute("data-form"); if(!id) return; e.preventDefault();
  var v=draft.trim(); if(!v){ var i=$("ans-"+id); if(i) i.focus(); return; }
  if(needName()) return;
  editing=null; draft=""; write(id, stamp({s:"decided", answer:v.slice(0,300)}));
});
document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest("button"); if(!t) return;
  var a;
  if((a=t.getAttribute("data-undo"))){ if(needName()) return; write(a,null); }
  else if((a=t.getAttribute("data-decide"))){ editing=a; draft=""; renderDyn(); var i=$("ans-"+a); if(i) i.focus(); }
  else if(t.hasAttribute("data-cancel")){ var was=editing; editing=null; draft=""; renderDyn(); var b=$("md-"+was); if(b) b.focus(); }
  else if((a=t.getAttribute("data-reveal"))){ reveal[a]=!reveal[a]; renderDyn(); }
  else if(t.hasAttribute("data-logall")){ logAll=!logAll; renderDyn(); }
  else if(t.hasAttribute("data-logstart")||t.hasAttribute("data-logstop")){ if(!db||!isOwner) return; var on=t.hasAttribute("data-logstart"); logStart=on?new Date().toISOString():""; renderDyn();
    var lr=db.doc("settings/log"); (on?lr.set({start:logStart}):lr["delete"]()).then(null,function(er){fail(er);}); }
  else if(t.hasAttribute("data-meet")||t.hasAttribute("data-meetset")){ if(!writable()||needName()) return; var mi=$("mt-date"); var dte=t.hasAttribute("data-meetset")?((mi&&mi.value)||meetDraft):t.getAttribute("data-meet"); if(t.hasAttribute("data-meetset")&&!/^\d{4}-\d{2}-\d{2}$/.test(dte)){ if(mi) mi.focus(); return; } meetDraft=""; meeting=dte?stamp({date:dte}):null; renderDyn();
    var ref=db.doc("settings/meeting"); (dte?ref.set(meeting):ref["delete"]()).then(function(){ var e={id:"meeting", act:dte?"meeting-set":"meeting-cleared"}; if(dte) e.date=dte; logAdd(e); },function(er){fail(er);}); }
  else if((a=t.getAttribute("data-copy"))){ var url=ART_URL+"#g-"+a;
    var ok=function(){flash="Link copied: "+url; renderDyn();}, no=function(){flash="Copy this link: "+url; renderDyn();};
    try{ navigator.clipboard.writeText(url).then(ok,no); }catch(er){ no(); } }
});
function route(){
  var h=(location.hash||"").replace("#","");
  if(h.indexOf("g-")===0&&BYG[h.slice(2)]){ ui.group=h.slice(2); saveUi(); if(q){ q=""; $("q").value=""; } }
  renderDyn();
}
window.addEventListener("hashchange",function(){ var h=(location.hash||"").replace("#",""); route(); if(h.indexOf("g-")===0){var c=$("g-"+ui.group); if(c&&c.scrollIntoView) c.scrollIntoView({block:"start"});} else window.scrollTo(0,0); });
setInterval(function(){ $("head").innerHTML=headHtml(); },60000);
setInterval(function(){ var c=$("count"); if(c) c.innerHTML=countHtml(); },1000);

shell(); $("myname").value=ui.name; $("count").innerHTML=countHtml(); route();

/* ---------- shared data ---------- */
var use=(window.claude&&window.claude.use)?function(n){return window.claude.use(n);}:function(){return Promise.resolve(null);};
var slow=setTimeout(function(){ if(!loaded){ loadNote="The shared ticks can’t be reached yet. The lists below show everything as open."; renderDyn(); } },10000);
use("user").then(function(u){
  user=u||null; if(!user) return null;
  return Promise.all([user.id(), user.can("data.write"), user.isOwner(), user.me()]).then(function(r){ uid=r[0]; isOwner=!!r[2];
    if(!ui.name&&r[3]&&r[3].name){ ui.name=String(r[3].name).slice(0,60); var nf=$("myname"); if(nf&&!nf.value) nf.value=ui.name; } if(r[1]===false) canWrite=false; else if(r[1]===true) canWrite=true; });
}).then(function(){ return use("db"); }).then(function(d){
  db=d||null;
  if(!db){ clearTimeout(slow); loaded=true; renderDyn(); return; }
  db.collection("marks").onSnapshot(function(snap){
    var m={}; snap.docs.forEach(function(doc){ var b=doc.data(); if(b&&b.s) m[doc.id]=b; });
    Object.keys(busy).forEach(function(id){ if(marks[id]) m[id]=marks[id]; else delete m[id]; });
    marks=m; if(!snap.metadata||!snap.metadata.fromCache||!loaded){ clearTimeout(slow); loaded=true; }
    renderDyn();
  },function(){ clearTimeout(slow); loaded=true; db=null; renderDyn(); });
  db.collection("log").orderBy("at","desc").limit(300).onSnapshot(function(snap){ logs=snap.docs.map(function(d){return d.data();}).filter(function(b){return b&&b.act&&b.at;}); renderDyn(); },function(){});
  db.doc("settings/log").onSnapshot(function(sn){ var b=sn.exists?sn.data():null; logStart=(b&&typeof b.start==="string")?b.start:""; renderDyn(); },function(){});
  db.doc("settings/meeting").onSnapshot(function(s){ var b=s.exists?s.data():null; meeting=(b&&b.date)?b:null; renderDyn(); },function(){});
},function(){ clearTimeout(slow); loaded=true; renderDyn(); });
})();
</script>
